name: Research MDRange backend guards
on:
  push:
    branches:
      - research/9725-backend-guard-validation
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mdrange:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backend: [SERIAL, OPENMP, THREADS]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DKokkos_ENABLE_TESTS=ON \
            -DKokkos_ENABLE_SERIAL=${{ matrix.backend == 'SERIAL' && 'ON' || 'OFF' }} \
            -DKokkos_ENABLE_OPENMP=${{ matrix.backend == 'OPENMP' && 'ON' || 'OFF' }} \
            -DKokkos_ENABLE_THREADS=${{ matrix.backend == 'THREADS' && 'ON' || 'OFF' }}
      - name: Build selected core unit tests
        run: cmake --build build --target Kokkos_CoreUnitTest_${{ matrix.backend == 'SERIAL' && 'Serial1' || matrix.backend == 'OPENMP' && 'OpenMP' || 'Threads' }} --parallel 2
      - name: Run MDRange regression tests
        shell: bash
        run: |
          ctest --test-dir build -N -R '^Kokkos_CoreUnitTest_${{ matrix.backend == 'SERIAL' && 'Serial1' || matrix.backend == 'OPENMP' && 'OpenMP' || 'Threads' }}
          ctest --test-dir build --output-on-failure -R 'CoreUnitTest_${{ matrix.backend == 'SERIAL' && 'Serial1' || matrix.backend == 'OPENMP' && 'OpenMP' || 'Threads' }}'

          ctest --test-dir build --output-on-failure -R '^Kokkos_CoreUnitTest_${{ matrix.backend == 'SERIAL' && 'Serial1' || matrix.backend == 'OPENMP' && 'OpenMP' || 'Threads' }}

